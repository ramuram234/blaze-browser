<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Blaze Browser</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(180deg, #E8F1FB 0%, #FFFFFF 40%);
      min-height: 100vh;
    }
    .header { padding: 28px 20px 0; }
    .brand { font-size: 26px; font-weight: 300; color: #9DB8D8; letter-spacing: -0.02em; }
    .search-bar {
      margin: 18px 16px 0;
      background: #FFFFFF;
      border-radius: 28px;
      height: 52px;
      display: flex;
      align-items: center;
      padding: 0 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    }
    .g-logo {
      width: 24px; height: 24px;
      font-size: 14px; font-weight: 700;
      color: #1A73E8;
      border: 1.5px solid #E0E0E0;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .search-bar input {
      flex: 1; border: none; outline: none;
      background: transparent; font-size: 15px;
      color: #444; padding: 0 10px;
    }
    .search-bar input::placeholder { color: #9AA0A6; }
    .search-icon { font-size: 18px; color: #9AA0A6; cursor: pointer; }
    .shortcuts { padding: 22px 16px 0; }
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .shortcut-item {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 2px; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .shortcut-item:active { opacity: 0.7; }
    .shortcut-icon {
      width: 52px; height: 52px; border-radius: 14px;
      background: #FFFFFF;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.09);
      margin-bottom: 6px; overflow: hidden;
    }
    .shortcut-icon img { width: 32px; height: 32px; object-fit: contain; border-radius: 6px; }
    .shortcut-label {
      font-size: 11px; color: #444;
      text-align: center; max-width: 56px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .add-btn .shortcut-icon {
      background: transparent; border: 2px dashed #CCC; box-shadow: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">Blaze Browser</div>
  </div>

  <form class="search-bar" id="sf">
    <div class="g-logo">G</div>
    <input id="q" type="text" placeholder="Search or Enter URL" autocomplete="off" autocorrect="off"/>
    <span class="search-icon">&#x1F50D;</span>
  </form>

  <div class="shortcuts">
    <div class="shortcuts-grid" id="grid"></div>
  </div>

  <script>
    var S = [
      ["Google",    "https://www.google.com",                     "google.com"],
      ["YouTube",   "https://m.youtube.com",                      "youtube.com"],
      ["Wikipedia", "https://en.wikipedia.org/wiki/Main_Page",    "wikipedia.org"],
      ["Reddit",    "https://www.reddit.com",                     "reddit.com"],
      ["X",         "https://x.com",                             "x.com"],
      ["GitHub",    "https://github.com",                         "github.com"],
      ["DuckDuckGo","https://duckduckgo.com",                     "duckduckgo.com"],
      ["Gmail",     "https://mail.google.com",                    "gmail.com"],
      ["Maps",      "https://maps.google.com",                    "maps.google.com"],
      ["Add sites", null,                                         null]
    ];
    var g = document.getElementById('grid');
    S.forEach(function(s) {
      var d = document.createElement('div');
      d.className = 'shortcut-item' + (s[2] ? '' : ' add-btn');
      d.innerHTML = '<div class="shortcut-icon">' +
        (s[2]
          ? '<img src="https://www.google.com/s2/favicons?domain='+s[2]+'&sz=64" onerror="this.style.display=\'none\'"/>'
          : '<span style="font-size:22px;color:#CCC">+</span>') +
        '</div><div class="shortcut-label">' + s[0] + '</div>';
      if (s[1]) { d.onclick = function() { BlazeBridge.open(s[1]); }; }
      g.appendChild(d);
    });
    document.getElementById('sf').onsubmit = function(e) {
      e.preventDefault();
      var q = document.getElementById('q').value.trim();
      if (q) BlazeBridge.open(q);
    };
    document.querySelector('.search-icon').onclick = function() {
      var q = document.getElementById('q').value.trim();
      if (q) BlazeBridge.open(q);
    };
  </script>
</body>
</html>
